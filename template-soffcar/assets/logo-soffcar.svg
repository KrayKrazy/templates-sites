<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <!-- Wiper and Bubble Icon -->
  <g transform="translate(15, 10)">
    <!-- Bubble Arch -->
    <path d="M 45 65 C 25 65, 12 50, 15 32 C 17 18, 30 8, 48 10 C 65 12, 78 26, 75 45 C 74 52, 70 58, 62 63 Z" fill="url(#cyanGradient)" opacity="0.9" />
    <path d="M 65 35 C 72 32, 78 38, 76 45 C 75 49, 70 52, 65 50" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
    <!-- Sparkles -->
    <path d="M 32 20 L 34 26 L 40 28 L 34 30 L 32 36 L 30 30 L 24 28 L 30 26 Z" fill="#E0F2FE" />
    <path d="M 42 38 L 43.5 42 L 47.5 43.5 L 43.5 45 L 42 49 L 40.5 45 L 36.5 43.5 L 40.5 42 Z" fill="#BAE6FD" />
    <!-- Squeegee Blade and Handle -->
    <g transform="rotate(-35 48 45)">
      <!-- Rubber blade head -->
      <rect x="22" y="18" width="52" height="7" rx="3.5" fill="#FFFFFF" />
      <rect x="24" y="22" width="48" height="3" rx="1.5" fill="#38BDF8" />
      <!-- Wiper connection neck -->
      <path d="M 44 25 L 44 32 L 52 32 L 52 25 Z" fill="#F1F5F9" />
      <!-- Handle -->
      <path d="M 45 32 L 43 55 C 43 58, 53 58, 53 55 L 51 32 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
      <line x1="48" y1="36" x2="48" y2="52" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
  <!-- Text SOFFCAR -->
  <text x="115" y="68" font-family="'Montserrat', 'Poppins', 'Inter', sans-serif" font-weight="900" font-size="48" letter-spacing="1.5" fill="#FFFFFF" filter="url(#textShadow)">SOFFCAR</text>
  <!-- Subtitle HIGIENIZAÇÃO E LIMPEZA -->
  <text x="118" y="94" font-family="'Montserrat', 'Poppins', 'Inter', sans-serif" font-weight="700" font-size="14.5" letter-spacing="4" fill="#38BDF8">HIGIENIZAÇÃO E LIMPEZA</text>
  <!-- Gradients and Filters -->
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="textShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
</svg>