<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Allura&amp;family=Montserrat:wght@500;600;700&amp;display=swap');
      .signature-text {
        font-family: 'Allura', cursive;
        font-size: 58px;
        fill: #4A352A;
      }
      .signature-tagline {
        font-family: 'Montserrat', sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.34em;
        fill: #7A8166;
        text-transform: uppercase;
      }
    </style>
    <linearGradient id="goldSig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C08E"/>
      <stop offset="50%" stop-color="#B89B5E"/>
      <stop offset="100%" stop-color="#967B42"/>
    </linearGradient>
  </defs>

  <g id="brand-signature">
    <!-- Assinatura Caligráfica em Allura -->
    <text x="35" y="75" class="signature-text">
      Michelle Cristina Sousa
    </text>

    <!-- Laço / Traço Caligráfico Decorativo com Folha de Oliveira -->
    <path d="M 35 96 C 110 102 240 106 380 94 C 440 88 490 84 525 90" 
          fill="none" 
          stroke="url(#goldSig)" 
          stroke-width="1.6" 
          stroke-linecap="round"/>

    <!-- Detalhe da folha e broto no final do traço -->
    <g transform="translate(528, 89) rotate(-15)" fill="#7A8166">
      <path d="M 0 0 C 6 -6 14 -4 16 0 C 14 4 6 6 0 0 Z"/>
      <circle cx="18" cy="1" r="1.5" fill="#B89B5E"/>
    </g>

    <!-- Subtitle com Tipografia Montserrat -->
    <text x="38" y="125" class="signature-tagline">
      Mentora de Identidade &amp; Propósito
    </text>
  </g>
</svg>
